name: CI

# Every job runs a section of scripts/check.sh rather than repeating its
# commands. A contributor running that script locally is running CI, not
# something resembling it — the previous arrangement had CONTRIBUTING.md
# listing three crates out of four and claiming "CI runs exactly these".
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check.sh rust

  daml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Daml SDK
        run: |
          curl -sSL https://get.daml.com | sh -s 2.10.4
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"
      - run: scripts/check.sh daml

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/check.sh ts

  # The third verifier. A break here means SPEC.md and the implementations have
  # drifted apart, which is the one failure the other jobs cannot see, since
  # they share an author.
  spec-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: scripts/check.sh audit
