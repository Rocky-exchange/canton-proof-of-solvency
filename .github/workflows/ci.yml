name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/solvency-merkle/Cargo.toml
      - run: cargo clippy --manifest-path rust/solvency-merkle/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path rust/solvency-merkle/Cargo.toml --check
      - run: cargo test --manifest-path rust/solvency-report/Cargo.toml
      - run: cargo clippy --manifest-path rust/solvency-report/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path rust/solvency-report/Cargo.toml --check
      - run: cargo test --manifest-path rust/solvency-cli/Cargo.toml
      - run: cargo clippy --manifest-path rust/solvency-cli/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path rust/solvency-cli/Cargo.toml --check
      - run: cargo test --manifest-path rust/reserve-attest/Cargo.toml
      - run: cargo clippy --manifest-path rust/reserve-attest/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path rust/reserve-attest/Cargo.toml --check

  daml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Daml SDK
        run: |
          curl -sSL https://get.daml.com | sh -s 2.10.4
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"
      - run: daml build
        working-directory: daml/solvency-anchor
      - run: daml test
        working-directory: daml/solvency-anchor

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: ts/verifier
      - run: npm test
        working-directory: ts/verifier

  # The third verifier (spec-audit/). It runs the golden vectors and the
  # corpus from the specification text with no dependencies, so a break here
  # means SPEC.md and the implementations have drifted apart — which is the
  # one failure the other two jobs cannot see, since they share an author.
  spec-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 spec-audit/verify_from_spec.py --verbose
