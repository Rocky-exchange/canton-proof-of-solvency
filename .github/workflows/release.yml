name: Release

# Publishing runs from a tag, not from a laptop. The token lives as a
# repository secret, so no crates.io credential is ever on a developer machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test and package without publishing"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The full suite runs before anything is published. A release that
      # skipped its tests would be the one release nobody could trust.
      - name: Test everything
        run: |
          for c in solvency-merkle solvency-report solvency-cli reserve-attest; do
            cargo test --manifest-path "rust/$c/Cargo.toml"
          done

      # Only the dependency-free crate can be packaged ahead of time. The
      # others resolve canton-solvency-merkle from the index, which does not
      # have it until the first publish — verifying them here would fail every
      # first release. `cargo publish` verifies each crate itself, after its
      # dependencies are live.
      - name: Verify the root crate packages
        run: cargo package --manifest-path rust/solvency-merkle/Cargo.toml

      - name: Publish in dependency order
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # crates.io needs a moment before a newly published version can be
          # resolved as a dependency. Poll for it rather than guessing a sleep:
          # a fixed wait is either too short on a bad day or wasted on a good
          # one, and too short means the next crate fails to resolve.
          await_index() {
            name="$1"; version="$2"
            for attempt in $(seq 1 60); do
              if curl -sf -A "canton-pos-release" \
                   "https://crates.io/api/v1/crates/${name}/${version}" > /dev/null; then
                echo "  ${name} ${version} is on the index"
                return 0
              fi
              sleep 10
            done
            echo "::error::${name} ${version} did not appear on the index" >&2
            return 1
          }

          version=$(grep -m1 '^version' rust/solvency-merkle/Cargo.toml | cut -d'"' -f2)
          echo "publishing version ${version}"

          for c in solvency-merkle solvency-report solvency-cli reserve-attest; do
            name=$(grep -m1 '^name' "rust/$c/Cargo.toml" | cut -d'"' -f2)
            echo "publishing ${name}"
            cargo publish --manifest-path "rust/$c/Cargo.toml"
            await_index "${name}" "${version}"
          done
