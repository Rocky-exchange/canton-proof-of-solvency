[package]
name = "canton-solvency-report"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Signed report and proof documents for Canton proof-of-solvency commitments"
repository = "https://github.com/Rocky-exchange/canton-proof-of-solvency"
keywords = ["canton", "proof-of-solvency", "merkle", "audit"]
categories = ["cryptography", "finance"]

[dependencies]
canton-solvency-merkle = { path = "../solvency-merkle", version = "0.1.0" }
anyhow = "1"
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
