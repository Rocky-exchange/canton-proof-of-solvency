[package]
name = "canton-solvency-report"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Signed report and proof documents for Canton proof-of-solvency commitments"
documentation = "https://docs.rs/"
repository = "https://github.com/Rocky-exchange/canton-proof-of-solvency"
keywords = ["canton", "proof-of-solvency", "merkle", "audit"]
readme = "../../README.md"
categories = ["cryptography", "finance"]

[dependencies]
canton-solvency-merkle = { path = "../solvency-merkle", version = "0.2.0" }
anyhow = "1"
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "canton-solvency-publish"
path = "src/bin/publish.rs"

[dev-dependencies]
tempfile = "3"
